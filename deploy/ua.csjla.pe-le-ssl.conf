# Oficina Virtual en https://ua.csjla.pe → contenedor oficina-virtual (127.0.0.1:4242)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ua.csjla.pe
    ErrorLog  ${APACHE_LOG_DIR}/oficina_error.log
    CustomLog ${APACHE_LOG_DIR}/oficina_access.log combined
    ProxyPreserveHost On
    ProxyRequests Off
    # tiempo real (SSE) y agente de campo: conexiones largas, sin buffer ni compresión
    SetEnvIf Request_URI "^/api/(events|worker/stream)" no-gzip=1
    ProxyPass        / http://127.0.0.1:4242/ timeout=3600 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:4242/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 26214400
    SSLCertificateFile /etc/letsencrypt/live/ua.csjla.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ua.csjla.pe/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
